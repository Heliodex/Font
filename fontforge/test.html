<!doctype html>
<html lang="en" style="--font: Dex Display">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Kern pairs test</title>

	<style>
		@font-face {
			font-family: "Dex Display";
			src: url("./DexDisplay.ttf") format("truetype");
		}

		@font-face {
			font-family: "Dex Display2";
			src: url("./test.ttf") format("truetype");
		}

		:root {
			background: black;
			color: white;
			font-size: 3rem;
		}

		* {
			font-family: var(--font), sans-serif;
		}
	</style>

	<script>
		// every second, change the font-family to Dex Display and back to Dex Display2, to test if the kerning pairs are applied correctly
		setInterval(() => {
			// 	const root = document.documentElement
			// 	if (root.style.fontFamily === "Dex Display")
			// 		root.style.fontFamily = "Dex Display2"
			// 	else
			// 		root.style.fontFamily = "Dex Display"
			const root = document.documentElement
			root.style.setProperty("--font", root.style.getPropertyValue("--font") === "Dex Display" ? "Dex Display2" : "Dex Display")
		}, 500)
	</script>
</head>

<body>
	<pre>
Web browsers really do have the best font rendering.
LT
AV
	</pre>
</body>

</html>
